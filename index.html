    <style>
        :root { 
            --bg: #d1e0d1; 
            --olivier-gold: #fbbf24; 
            --brick: #1e293b; 
            --correct: #10b981; 
            --wrong: #f43f5e; 
            --text: #f8fafc;
            --accent: #3b82f6;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); color: var(--text); 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 10px; border-bottom: 4px solid var(--olivier-gold); width: 100%; max-width: 450px; }
        h1 { margin: 10px 0; letter-spacing: 2px; color: var(--olivier-gold); font-size: 1.8rem; }
        #dailyVol { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        
        .hint-container { text-align: center; margin: 10px 0 20px 0; }
        .main-callout { font-size: 2.2rem; font-weight: 900; margin: 0; line-height: 1.2; color: var(--olivier-gold); text-transform: uppercase; }
        .word-hint { font-size: 1.2rem; font-weight: 600; margin-top: 5px; color: var(--text); letter-spacing: 1px; }

        .bricks-container { 
            display: flex; flex-direction: column-reverse; 
            gap: 8px; width: 100%; max-width: 450px; margin-bottom: 20px; 
        }

        .brick { 
            background: var(--brick); border-left: 5px solid #334155; 
            padding: 12px; border-radius: 4px; opacity: 0.1; filter: blur(2px);
            transition: all 0.4s ease;
        }

        .brick.revealed { opacity: 1; filter: blur(0); border-left-color: var(--olivier-gold); }
        .brick.title-reveal.revealed { border-left-color: var(--correct); background: #064e3b; animation: successFlash 0.5s ease; }
        
        @keyframes successFlash {
            0% { background: var(--olivier-gold); }
            100% { background: #064e3b; }
        }

        .brick-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        .brick-value { font-size: 1rem; font-weight: 600; margin-top: 2px; }
        
        .underscore-font { letter-spacing: 3px; font-family: 'Courier New', monospace; font-size: 1.1rem; color: var(--olivier-gold); }

        .controls { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; gap: 8px; }
        input { 
            flex: 1; padding: 15px; border-radius: 5px; border: 2px solid #334155; 
            background: #1e293b; color: white; font-size: 1rem; outline: none; 
        }
        input:focus { border-color: var(--olivier-gold); }
        input:disabled { opacity: 0.5; }
        
        .btn-main { padding: 0 20px; border-radius: 5px; border: none; background: var(--olivier-gold); color: black; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-share { padding: 15px; background: var(--accent); color: white; border: none; border-radius: 5px; font-weight: 800; cursor: pointer; display: none; text-transform: uppercase; }

        .secondary-controls { display: flex; justify-content: space-between; gap: 10px; }
        .btn-sub { flex: 1; background: transparent; color: #64748b; font-size: 0.7rem; padding: 12px; border: 1px solid #334155; border-radius: 5px; cursor: pointer; text-transform: uppercase; }

        #message { margin-top: 15px; font-weight: bold; text-align: center; min-height: 3em; line-height: 1.4; }
        #timer { color: var(--olivier-gold); font-size: 1.2rem; }
        .stats-container { margin-top: 10px; display: flex; gap: 20px; color: #64748b; font-size: 0.8rem; }
        .high-score { color: var(--olivier-gold); font-weight: bold; }
        .copyright { position: fixed; bottom: 10px; right: 10px; font-size: 0.8rem; color: #FFFFFF; text-transform: uppercase; }
    </style>
</head>

    let currentShow = null;
    let revealedCount = 1;
    let streak = parseInt(localStorage.getItem('theatreBricksStreakWE')) || 0;
    let bestStreak = parseInt(localStorage.getItem('theatreBricksBestWE_Final')) || 0;
    let activeBricks = [];
    let todayStr = new Date().toDateString();

    function getDailyIndex() {
        const start = new Date("January 1, 2026");
        const now = new Date();
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        return { index: diff % theatreData.length, dayNum: diff + 1 };
    }

    function generateTitleClue(title) {
        return title.split(' ').map(word => {
            return word.split('').map((char, index) => {
                if (index === 0) return char;
                if (/[a-zA-Z]/.test(char)) return '_';
                return char;
            }).join('');
        }).join('&nbsp;&nbsp;');
    }

    function init() {
        const daily = getDailyIndex();
        currentShow = theatreData[daily.index];
        dailyNum = daily.dayNum;
        document.getElementById('dailyVol').innerText = `Show #${dailyNum}`;
        
        activeBricks = [
            { "role": "West End Premiere", "name": currentShow.year },
            ...currentShow.bricks,
            { "role": "Title Clue", "name": generateTitleClue(currentShow.title), "isUnderscore": true },
            { "role": "The Musical", "name": currentShow.title, "isFinal": true }
        ];

        document.getElementById('highScore').innerText = bestStreak;
        document.getElementById('streak').innerText = streak;

        // Check if already played today
        if (localStorage.getItem('lastPlayedWE') === todayStr) {
            revealedCount = parseInt(localStorage.getItem('lastRevealedWE')) || 6;
            lockGame();
        }

        const wordCount = currentShow.title.split(' ').length;
        document.getElementById('wordHint').innerText = `${wordCount} Word${wordCount > 1 ? 's' : ''}`;
        renderBricks();
    }

    function renderBricks() {
        const container = document.getElementById('bricksContainer');
        container.innerHTML = '';
        activeBricks.forEach((brick, index) => {
            const isRevealed = index < revealedCount;
            const div = document.createElement('div');
            div.className = `brick ${isRevealed ? 'revealed' : ''} ${brick.isFinal ? 'title-reveal' : ''}`;
            const valClass = brick.isUnderscore ? 'brick-value underscore-font' : 'brick-value';
            div.innerHTML = `<div class="brick-label">${brick.role}</div><div class="${valClass}">${isRevealed?brick.name:'???'}</div>`;
            container.appendChild(div);
        });
    }

    function skipClue() {
        if (revealedCount < activeBricks.length - 1) {
            revealedCount++;
            renderBricks();
        }
    }

    function handleGuess() {
        const input = document.getElementById('guessInput');
        const guess = input.value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
        const actual = currentShow.title.toLowerCase().replace(/[^a-z0-9]/g, "");

        if (guess === actual || (actual.includes(guess) && guess.length > 5)) {
            streak++;
            if (streak > bestStreak) {
                bestStreak = streak;
                localStorage.setItem('theatreBricksBestWE_Final', bestStreak);
            }
            localStorage.setItem('theatreBricksStreakWE', streak);
            endGame("CURTAIN CALL! SUCCESS 🎭");
        } else {
            if (revealedCount < activeBricks.length - 1) {
                revealedCount++; 
                renderBricks();
                document.getElementById('message').innerText = "Incorrect! Next brick revealed.";
            } else {
                streak = 0;
                localStorage.setItem('theatreBricksStreakWE', 0);
                endGame(`Show Closed! It was ${currentShow.title}`);
            }
        }
        input.value = "";
    }

    function surrender() { 
        streak = 0;
        localStorage.setItem('theatreBricksStreakWE', 0);
        endGame(`You gave up! It was ${currentShow.title}`); 
    }

    function endGame(msg) {
        localStorage.setItem('lastPlayedWE', todayStr);
        localStorage.setItem('lastRevealedWE', revealedCount);
        localStorage.setItem('lastResultWE', revealedCount);
        document.getElementById('message').innerText = msg;
        revealedCount = 6;
        renderBricks();
        lockGame();
    }

    function lockGame() {
        document.getElementById('guessInput').disabled = true;
        document.getElementById('mainInputGroup').style.display = 'none';
        document.getElementById('secondaryGroup').style.display = 'none';
        document.getElementById('shareBtn').style.display = 'block';
        startTimer();
    }

    function startTimer() {
        const timerFn = () => {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diff = tomorrow - now;
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            const msg = document.getElementById('message');
            if(!msg.innerHTML.includes("NEXT SHOW")) {
                msg.innerHTML += `<br><br>NEXT SHOW IN:<br><span id="timer">--:--:--</span>`;
            }
            document.getElementById('timer').innerText = `${h}h ${m}m ${s}s`;
        };
        timerFn();
        setInterval(timerFn, 1000);
    }

    function copyShare() {
        const result = parseInt(localStorage.getItem('lastResultWE'));
        const win = result < 6;
        let grid = "";
        for(let i=1; i<=5; i++) grid += (i < result) ? "🧱" : (win ? "⬜" : "❌");
        const text = `Theatre Bricks #${dailyNum}\n${grid}\nStreak: ${streak}\nhttps://brick-game.github.io/theatrebricks/`;
        navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
    }

    document.getElementById('guessInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleGuess(); });
    window.onload = init;
</script>
</body>
</html>
